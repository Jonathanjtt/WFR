target = "MoG40"
init_seed = 0
n_iterations = 300

[init]
offset = [0.0, 0.0]       # initial means centered at the origin
spread = 40.0
cov_scale = 1

[methods.ibw]
learning_rate = 0.5
BG = 64                   # gradient-noise batch
BKL = 1000                # samples for the reverse-KL diagnostic

[methods.WFR]
eta_mode = "fixed"
eta_w = 1.0               # fixed W step
fr_step_mode = "fixed"
dt_fr = 0.1               # fixed FR step
J = 64
BKL = 1000
mu_minus = 1e-5
mu_plus = 20

[methods.gmbbvi]
dt_max = 0.5
beta = 1.5
eta_min = 0.1
J = 64
BKL = 1000
compute_kl = 10

[methods.semtrux]
init_stepsize = 2.0
max_stepsize = 2.0
weight_stepsize = 1.5
stepsize_inc_factor = 1.3
min_stepsize = 1e-3
stepsize_dec_factor = 0.85
J = 64
BKL = 1000
compute_kl = 10

[metrics.ot]
relative_epsilon = 0.01
