K = 5
n_iterations = 1000
init_seed = 3

[target_kwargs]
sigma0 = 2.23606797749979   # sqrt(5), inference prior sd
sigma0_truth = 5.0
seed_truth = 17

[init]
offset = 0.0                # initial means centered at the origin
spread = 2.23606797749979
cov_scale = 1e-4
negate_pairs = false

[methods.gmbbvi]
dt_max = 0.5
beta = 0.9
eta_min = 0.1
J = 512                     # MC samples per component per iteration
BKL = 1000                  # samples for the reverse-KL diagnostic
compute_kl = 10

[methods.semtrux]
init_stepsize = 0.1
max_stepsize = 1.0
stepsize_inc_factor = 1.15
J = 512
BKL = 1000
compute_kl = 10

[methods.ibw]
learning_rate = 0.0001
BG = 64                     # gradient-noise batch
BKL = 1000
compute_kl = 10

[methods.WFR]
dt_fr = 0.1                 # adaptive FR-step ceiling
n_w_steps = "auto"
eta_mode = "adaptive"
eta_max = 0.25              # adaptive W-step ceiling
fr_step_mode = "adaptive"
max_w_steps = 10
J = 512
BKL = 1000
compute_kl = 10
mu_minus = 0.0001
mu_plus = 10000.0

[metrics]
n_ess = 2000
ess_seeds = 5

[metrics.ot]
enabled = false

[metrics.mmd]
enabled = false
