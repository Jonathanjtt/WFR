K = 20
n_iterations = 1000
init_seed = 0
log_covs = false

[init]
offset = 0.0              # initial means centered at the origin
spread = 1.0
cov_scale = 1e-4

[methods.gmbbvi]
dt_max = 0.5
J = 128                   # MC samples per component per iteration
BKL = 1000                # samples for the reverse-KL diagnostic
compute_kl = 10

[methods.semtrux]
J = 128
BKL = 1000
compute_kl = 10

[methods.ibw]
learning_rate = 2e-3
BG = 64                   # gradient-noise batch
BKL = 1000
compute_kl = 10

[methods.WFR]
dt_fr = 0.3               # adaptive FR-step ceiling
n_w_steps = "auto"
eta_mode = "adaptive"
eta_max = 0.25            # adaptive W-step ceiling
fr_step_mode = "adaptive"
max_w_steps = 25
J = 128
BKL = 1000
compute_kl = 10
mu_minus = 1e-4
mu_plus = 1000.0

[metrics]
coverage_radius = 3.0
n_ess = 2000
ess_seeds = 3

[metrics.ot]
enabled = true
relative_epsilon = 0.001
max_scale_samples = 2000
scale_seed = 0
normalize_by_dim = false
n = 2000                  # samples per cloud in the OT problem
seed = 0
target_seed = 0
max_iterations = 20_000

[metrics.mmd]
enabled = true
max_points = 2048
bandwidth_seed = 99
n = 2000                  # samples per cloud for the MMD estimate
seed = 0
target_seed = 0
biased = true
